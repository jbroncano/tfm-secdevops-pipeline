name: base

on:
  push:
    branches: [develop, main, 'release/**']
  pull_request:
    branches: [develop, main]

jobs:
  politica-ramas:
    runs-on: ubuntu-latest
    steps:
      - name: main solo acepta PR desde release/* o hotfix/*
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          case "${{ github.head_ref }}" in
            release/*|hotfix/*) echo "Rama permitida: ${{ github.head_ref }}" ;;
            *) echo "::error::A main solo se integra desde release/* o hotfix/*"; exit 1 ;;
          esac

  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/expenses_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    needs: [politica-ramas, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t app-backend:${{ github.sha }} backend
      - run: docker build -t app-frontend:${{ github.sha }} frontend
